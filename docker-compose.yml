services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    volumes:
      - ./:/work
    ports:
      - "8001:8000"
    command: [ "mkdocs", "serve", "-f", "docs/mkdocs.yml", "--dev-addr=0.0.0.0:8000" ]

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - ./data:/app/scraped_data
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173" ]
    environment:
      CHOKIDAR_USEPOLLING: true

volumes:
  postgres_data:
